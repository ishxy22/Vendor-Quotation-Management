# Application Name
spring.application.name=QuotationManagement

# ===============================
# Dynamic PostgreSQL Database Configuration
# Uses Render Environment Variables on the Cloud, falls back to Localhost locally
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vendor_quotation_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PostIsh}

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# Dynamically binds to the port assigned by Render ($PORT) or default 8080 locally
# ===============================
server.port=${PORT:8080}

# ===============================
# Logger Configuration - automatically creates logs/app.log
# ===============================
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.vendor.quotation_management=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n