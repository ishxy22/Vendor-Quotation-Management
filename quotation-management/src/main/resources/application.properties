# Application Name
spring.application.name=QuotationManagement

# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/vendor_quotation_db
spring.datasource.username=postgres
spring.datasource.password=PostIsh

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# ===============================
server.port=8080

# Logger Configuration - automatically creates logs/app.log
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.vendor.quotation_management=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n